# Unified tmux configuration for tmux 3.4+
# Optimized for macOS with native tmux syntax
# Last updated: 2025-12-11
#
# Color scheme: Emerald Arcana (palette in scripts/palette.zsh)
#   #13101f - Background (violet-black)
#   #8a82ab - Comment (inactive text, secondary)
#   #3a3160 - Border (inactive pane borders)
#   #dcd7f0 - Foreground (primary text)
#   #a98bf5 - Violet (active border, current window)
#   #2fd49b - Emerald (session, messages, prefix indicator)
#   #52d6c8 - Aqua (user and host)
#   #e8b46a - Amber (bell)
#
# macOS Specific Notes:
#   - Uses native pbcopy/pbpaste for clipboard
#   - Optimized for Kitty and native macOS Terminal
#   - Integrated with macOS key repeat settings

# ==============================================================================
# GENERAL SETTINGS
# ==============================================================================

# Terminal configuration (macOS optimized)
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",gnome*:RGB"
set -as terminal-features ",xterm-kitty:RGB"

# Enable extended keys for modern terminals (tmux 3.2+)
# Supports modifier keys like C-Up, M-PageUp, etc.
set -g extended-keys on

# macOS specific: Allow system key repeat to work properly
# Disable key repeat rate limiting for Kitty integration
set -s repeat-time 1000

# Performance and responsiveness
set -s escape-time 10                     # faster command sequences (10ms for better macOS compatibility)
set -s focus-events on                    # enable focus events
set -s bell-action none                   # disable system bell

# GNU-Screen compatible prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# History and buffer
set -g history-limit 50000                # boost history

# Mouse support (tmux 2.1+)
set -g mouse on                           # enable mouse support for scrolling, selecting panes, resizing

# Mouse wheel scrolling in copy mode
bind -T copy-mode-vi WheelUpPane send -X scroll-up
bind -T copy-mode-vi WheelDownPane send -X scroll-down

# Mouse shortcuts (double-click, triple-click) - configured per platform below
# These bindings are set in the clipboard section for platform-specific commands

# ==============================================================================
# DISPLAY AND APPEARANCE
# ==============================================================================

# Window and pane numbering
set -g base-index 1                       # start windows numbering at 1
setw -g pane-base-index 1                 # make pane numbering consistent with windows

# Window management
setw -g automatic-rename on               # rename window to reflect current program
set -g renumber-windows on                # renumber windows when a window is closed

# Terminal title
set -g set-titles on
set -g set-titles-string '#h | #S | #I #W'

# Display timers
set -g display-panes-time 2000            # pane indicators display time
set -g display-time 1500                  # status messages display time
set -g status-interval 10                 # redraw status line every 10 seconds

# Activity monitoring
set -g monitor-activity on
set -g visual-activity off

# ==============================================================================
# COLOR SCHEME AND STYLING - Emerald Arcana
# ==============================================================================

# Pane borders
set -g pane-border-style "fg=#3a3160"
set -g pane-active-border-style "fg=#a98bf5"

# Pane display indicators (when you hit <prefix> + q)
set -g display-panes-colour "#dcd7f0"
set -g display-panes-active-colour "#2fd49b"

# Message style (status line messages)
set -g message-style "fg=#13101f,bg=#2fd49b,bold"
set -g message-command-style "fg=#2fd49b,bg=#13101f,bold"

# Mode style (copy mode, etc.)
setw -g mode-style "fg=#dcd7f0,bg=#3b2f66,bold"

# Clock style (when you hit <prefix> + t)
setw -g clock-mode-colour "#a98bf5"
setw -g clock-mode-style 24

# ==============================================================================
# STATUS BAR CONFIGURATION - Emerald Arcana
# ==============================================================================

# Status bar position and style
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=#dcd7f0,bg=#13101f"

# Status left: Session name and window count
set -g status-left-length 40
set -g status-left "#[fg=#13101f,bg=#2fd49b,bold] 🦊 #S #[fg=#2fd49b,bg=#13101f]#[fg=#dcd7f0,bg=#13101f] "

# Status right: Indicators, time, date, user, and host
set -g status-right-length 80
set -g status-right "#[fg=#dcd7f0,bg=#13101f]#{?client_prefix,#[fg=#2fd49b]⌨ ,}#{?pane_synchronized,#[fg=#8a82ab]🔒 ,}#[fg=#dcd7f0]%H:%M #[fg=#8a82ab]| #[fg=#dcd7f0]%d-%b #[fg=#8a82ab]| #[fg=#52d6c8]#(whoami) #[fg=#8a82ab]@ #[fg=#52d6c8]#h "

# Window status format (inactive windows)
setw -g window-status-format "#[fg=#8a82ab,bg=#13101f] #I #W "
setw -g window-status-style "fg=#8a82ab,bg=#13101f"

# Window status format (current/active window)
setw -g window-status-current-format "#[fg=#13101f,bg=#a98bf5,bold] #I #W "
setw -g window-status-current-style "fg=#13101f,bg=#a98bf5,bold"

# Window status - activity
setw -g window-status-activity-style "fg=#dcd7f0,bg=default,underscore"

# Window status - bell
setw -g window-status-bell-style "fg=#e8b46a,bg=default,blink,bold"

# Window status - last
setw -g window-status-last-style "fg=#dcd7f0,bg=default"

# Separator between windows
setw -g window-status-separator ""

# ==============================================================================
# KEY BINDINGS
# ==============================================================================

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Configuration reloaded!"

# Edit configuration
bind e new-window -n "~/.tmux.conf" sh -c '${EDITOR:-vim} ~/.tmux.conf && tmux source ~/.tmux.conf && tmux display "Configuration reloaded!"'

# Session management
bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l

# Window splitting (retain current path)
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

# Pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Window navigation (macOS compatible)
unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind -r n next-window
bind -r p previous-window

# Toggle mouse mode
bind m run-shell "tmux set -g mouse $(tmux show -gv mouse | grep -q on && echo off || echo on); tmux display \"Mouse: $(tmux show -gv mouse)\""

# ==============================================================================
# COPY MODE (VI-STYLE)
# ==============================================================================

# Enable vi key bindings in copy mode (required for copy-mode-vi table bindings)
setw -g mode-keys vi

bind Enter copy-mode

# Vi-style key bindings in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# Copy to system clipboard (optimized for macOS with pbcopy)
# Vi-style copy mode: 'y' to copy selection to clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy; tmux display 'Copied to clipboard'"

# Mouse interactions in copy mode
# End of selection = copy to clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy; tmux display 'Copied to clipboard'"

# Double-click to select word and copy (stays in copy mode)
bind -T copy-mode-vi DoubleClick1Pane send -X select-word \; send -X copy-pipe-no-clear "pbcopy; tmux display 'Copied word'"

# Triple-click to select line and copy (stays in copy mode)
bind -T copy-mode-vi TripleClick1Pane send -X select-line \; send -X copy-pipe-no-clear "pbcopy; tmux display 'Copied line'"

# Right-click (mouse button 3) to paste from clipboard
bind -n MouseDown3Pane run-shell "pbpaste | tmux load-buffer -; tmux paste-buffer; tmux display 'Clipboard pasted'"

# ==============================================================================
# BUFFER MANAGEMENT
# ==============================================================================

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

# ==============================================================================
# CUSTOMIZATION SECTION
# ==============================================================================
# Add your personal customizations below this line
# This section is preserved when updating the base configuration

# Example customizations:
# set -g status-position top
# bind C-x kill-pane

# ==============================================================================
# NEOVIM INTEGRATION (macOS optimized)
# ==============================================================================
# Smart pane switching with awareness of Neovim splits
# Works with vim-tmux-navigator plugin
# macOS uses different ps format
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$' 2>/dev/null || false"

bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Copy mode navigation
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R

# Clear screen while maintaining pane/vim awareness (C-l when not in vim)
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'send-keys C-l'

# ==============================================================================
# TMUX PLUGIN MANAGER (TPM)
# ==============================================================================
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# REMOVED: tmux-plugins/tmux-yank - conflicts with native pbcopy bindings
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-resurrect settings
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 irb pry node'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Native clipboard integration (pbcopy/pbpaste on macOS)
# No additional plugin needed - configured directly in key bindings above

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# EOF
