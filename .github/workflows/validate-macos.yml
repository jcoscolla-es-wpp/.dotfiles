name: Validate macOS

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: zsh -df -e -o pipefail {0}

jobs:
  validate:
    name: macOS Config Validation
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # ── Install tools ──────────────────────────────────────────────────────
      - name: Install tools
        run: |
          brew install tmux neovim kitty mise fzf zoxide direnv
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # ── Symlink configs ────────────────────────────────────────────────────
      - name: Symlink configs
        run: |
          make zsh
          zsh scripts/link-config.zsh "$GITHUB_WORKSPACE/tmux.conf" "$HOME/.tmux.conf"
          zsh scripts/link-config.zsh "$GITHUB_WORKSPACE/kitty.conf" "$HOME/.config/kitty/kitty.conf"
          zsh scripts/link-config.zsh "$GITHUB_WORKSPACE/nvim" "$HOME/.config/nvim"

      - name: "[Shell] Syntax and regression tests"
        run: make test

      # ── ZSH: syntax ────────────────────────────────────────────────────────
      - name: "[ZSH] Syntax check"
        run: |
          echo "Checking zshrc..."
          zsh -n "$HOME/.zshrc"
          echo "Checking all modules in zsh.d/..."
          failed=0
          for f in zsh.d/*.zsh; do
            if zsh -n "$f" 2>/dev/null; then
              echo "  OK  $f"
            else
              echo "  FAIL $f"
              failed=$((failed + 1))
            fi
          done
          [ $failed -eq 0 ] && echo "ZSH syntax OK" || { echo "$failed module(s) failed"; exit 1; }

      # ── ZSH: startup time ─────────────────────────────────────────────────
      - name: "[ZSH] Startup time"
        run: |
          results=$(zsh scripts/benchmark-shell.zsh 7)
          print -r -- "$results"
          non_tty=$(print -r -- "$results" | awk -F= '/^non_tty_median_ms=/ {print $2}')
          pty=$(print -r -- "$results" | awk -F= '/^pty_median_ms=/ {print $2}')
          print -r -- "STARTUP_NON_TTY=$non_tty" >> "$GITHUB_ENV"
          print -r -- "STARTUP_PTY=$pty" >> "$GITHUB_ENV"
          # Runner budget, not the local 110ms target. Plugin readiness is tested separately.
          (( non_tty <= 500 && pty <= 500 )) || { print -ru2 -- 'Startup exceeds the 500ms runner budget'; exit 1; }

      - name: "[ZSH] Comment startup time on PR"
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const nonTty = process.env.STARTUP_NON_TTY || 'n/a';
            const pty = process.env.STARTUP_PTY || 'n/a';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ZSH startup-and-exit\n| Metric | Median (7 warm samples) |\n|--------|-------|\n| Non-TTY | ${nonTty}ms |\n| PTY (includes script overhead) | ${pty}ms |\n\nRunner budget: 500ms for each metric. First-prompt latency is not measured here; interactive plugin readiness is tested separately.`
            });

      # ── TMUX ──────────────────────────────────────────────────────────────
      - name: "[TMUX] Validate config"
        run: |
          zsh scripts/validate-configs.zsh

      # ── Kitty ─────────────────────────────────────────────────────────────
      - name: "[Kitty] Validate config"
        run: |
          kitty +runpy 'from kitty.config import load_config; errors = []; load_config("kitty.conf", accumulate_bad_lines=errors); assert not errors, errors; print("Kitty config parsed")'

      # ── Neovim ────────────────────────────────────────────────────────────
      - name: "[Nvim] Validate config"
        run: |
          nvim --headless "+qa" 2>&1
          echo "Neovim config OK (exit $?)"

      # ── Mise ──────────────────────────────────────────────────────────────
      - name: "[Mise] Validate"
        run: |
          mise --version
          mise doctor || true
          echo "Mise OK"

      # ── macOS Security ────────────────────────────────────────────────────
      - name: "[macOS] Security checks"
        run: |
          echo "=== SIP Status ==="
          csrutil status 2>&1 || echo "Note: SIP status unavailable outside Recovery"
          echo "=== Gatekeeper Status ==="
          spctl --status 2>&1 || echo "Note: Gatekeeper status unavailable"
          echo "macOS security checks complete"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: GitHub Step Summary
        if: always()
        run: |
          echo "## macOS Config Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tool | Check |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ZSH | Syntax (zshrc + zsh.d modules) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ZSH | Warm startup-and-exit medians: non-TTY ${STARTUP_NON_TTY:-n/a}ms, PTY ${STARTUP_PTY:-n/a}ms; runner budget 500ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Shell | \`make test\`: native fallback, installer safety, effective tmux bindings, installed-plugin PTY test when dependencies are present |" >> "$GITHUB_STEP_SUMMARY"
          echo "| TMUX | Parse-only validation on a disposable private socket |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kitty | Headless configuration parser |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Neovim | \`nvim --headless +qa\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mise | \`mise doctor\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS | SIP + Gatekeeper status |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Runner: \`macos-latest\` (GitHub-hosted, on-demand)" >> "$GITHUB_STEP_SUMMARY"
